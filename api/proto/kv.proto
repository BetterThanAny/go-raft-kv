syntax = "proto3";

package raftkv.v1;

option go_package = "go-raft-kv/api/proto;raftkvpb";

service KV {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CAS(CASRequest) returns (CASResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool ok = 1;
  string error = 2;
  string leader_id = 3;
  string leader_address = 4;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool ok = 1;
  bool found = 2;
  string value = 3;
  string error = 4;
  string leader_id = 5;
  string leader_address = 6;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool ok = 1;
  bool found = 2;
  string previous_value = 3;
  string error = 4;
  string leader_id = 5;
  string leader_address = 6;
}

message CASRequest {
  string key = 1;
  string expected = 2;
  string value = 3;
}

message CASResponse {
  bool ok = 1;
  bool swapped = 2;
  bool found = 3;
  string current_value = 4;
  string error = 5;
  string leader_id = 6;
  string leader_address = 7;
}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  string state = 2;
  uint64 term = 3;
  string leader_id = 4;
  string leader_address = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
  uint64 last_log_index = 8;
  uint64 snapshot_index = 9;
  map<string, string> peers = 10;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
  uint64 match_index = 4;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}

